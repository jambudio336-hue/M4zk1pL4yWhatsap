name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck bin/m4zk1p lib/platform.sh install.sh uninstall.sh
      - run: python3 -m py_compile lib/payload.py lib/otp.py
      - run: node --check lib/auto.js
